server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Hashed build output: cache for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  # Service worker and its file list must always be revalidated.
  location = /sw.js          { add_header Cache-Control "no-cache"; }
  location = /precache.json  { add_header Cache-Control "no-cache"; }

  location = /admin  { return 301 /admin/; }
  location /admin/   { try_files $uri $uri/ /admin/index.html; }

  # Single-page-app fallback for /map, /species/:id, /territories...
  location / { try_files $uri $uri/ /index.html; }
}
