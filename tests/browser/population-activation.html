<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Population visualization — synthetic test fixtures</title>
<style>body{font-family:sans-serif;margin:12px}#controls{display:flex;flex-wrap:wrap;gap:8px}button{min-height:44px}#subject{max-width:600px;margin:20px auto}</style>
<h1>SYNTHETIC TEST FIXTURES — NOT SCIENTIFIC ESTIMATES</h1><div id="app"></div>
<script type="module">
import {createApp,computed,h,ref} from 'vue'
import Visualization from '/src/components/SpeciesVisualization.vue'
import Modal from '/src/components/SpeciesModal.vue'
import Page from '/src/components/SpeciesPage.vue'
import {fixtures,sources} from '/tests/helpers/population-fixtures.mjs'
import {siteLanguage} from '/src/composables/useLocale.js'
import '/src/style.css'
const catalog=await(await fetch('/data/species.json')).json()
siteLanguage.value='ru'
const kind=ref('unknown'),id=ref('first'),photo=ref(true),broken=ref(false),shown=ref(true),view=ref('visualization')
const species=computed(()=>({...catalog[0],id:id.value,population:fixtures[kind.value],sources,images:photo.value?(broken.value?[{...catalog[0].images[0],path:'/images/missing-activation-test.webp'}]:catalog[0].images):[]}))
window.fixture={kind,id,photo,shown,view,siteLanguage,species}
createApp({setup(){return()=>h('div',[
 h('div',{id:'controls'},[
 ...Object.keys(fixtures).map(key=>h('button',{'data-kind':key,onClick:()=>{kind.value=key;shown.value=true}},key)),
 h('button',{id:'switch-species',onClick:()=>id.value=id.value==='first'?'second':'first'},'Switch species'),
 h('button',{id:'no-photo',onClick:()=>photo.value=!photo.value},'Toggle photograph'),
 h('button',{id:'broken-photo',onClick:()=>broken.value=!broken.value},'Toggle broken photograph'),
 h('button',{id:'unmount',onClick:()=>shown.value=!shown.value},'Mount / unmount'),
 ...['visualization','modal','page'].map(key=>h('button',{'data-view':key,onClick:()=>view.value=key},key)),
 ...['ky','uz','ru','en'].map(key=>h('button',{'data-language':key,onClick:()=>siteLanguage.value=key},key))]),
 h('div',{id:'subject'},shown.value?[view.value==='visualization'?h(Visualization,{photo:species.value.images[0],name:'SYNTHETIC FIXTURE',population:species.value.population,sources,speciesId:id.value}):view.value==='modal'?h(Modal,{species:species.value,onClose:()=>shown.value=false}):h(Page,{species:species.value})]:[])
])}}).mount('#app')
</script></html>
