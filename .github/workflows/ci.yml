name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      # Historical fixtures are committed alongside the tests.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fetch historical commits used by audit fixtures
        shell: bash
        run: |
          grep -RhoE (initialHead|sourceCommit|baseCommit|baselineCommit|readinessCommit|commit)[[:space:]]*:[[:space:]]*[0-9a-f]{40} data tests \\
            | grep -oE [0-9a-f]{40} | sort -u | while read -r commit; do
              git cat-file -e "$commit^{commit}" 2>/dev/null || git fetch --no-tags origin "$commit"
            done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -r scripts/requirements.txt
      - run: npm run data:validate
      - run: npm test -- --test-concurrency=1
      - run: npm run build